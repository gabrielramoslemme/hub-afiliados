AWSTemplateFormatVersion: '2010-09-09'
Description: >
  porto-hub-afiliados - ambiente de DESENVOLVIMENTO. Instancia unica com Docker
  Compose (Caddy + web + API), RDS Postgres em subnets privadas, imagens no ECR
  e deploy por documento SSM. CloudFront na frente termina o TLS e da um nome
  estavel para a Imperva apontar. Sem ALB, NAT Gateway, ASG nem Multi-AZ: as
  escolhas e os custos estao em infra/cloudformation/README.md.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z0-9-]{2,12}$'
    Description: Prefixo de nome e tag de todo recurso da stack.

  # Os tres parametros abaixo nascem VAZIOS de proposito, e e isso que permite
  # o ambiente subir antes de a Porto emitir o certificado. Sao tres modos:
  #
  #   vazio / vazio / vazio  -> serve em https://<id>.cloudfront.net, com o
  #                             certificado padrao da AWS. Valida o ambiente
  #                             inteiro; o host da API nao existe.
  #   dev. / vazio / cert    -> ambiente de verdade. A API continua alcancavel
  #                             so pelo servidor do Next e pelo tunel do SSM.
  #   dev. / api-dev. / cert -> quando /v1/webhooks existir e a Porto for
  #                             chamar de fora.
  #
  # Passar do primeiro modo para os outros e um update de stack seguido de um
  # deploy: Aliases e ViewerCertificate mudam a distribuicao no lugar, sem
  # substituir nada, e o Caddyfile pega os nomes no deploy seguinte.
  DomainName:
    Type: String
    Default: ''
    Description: >
      Host da aplicacao web, ex. dev.hubafiliados.com.br. Serve a landing page,
      a area do afiliado e o painel - sao um app Next so. Vira Alias do
      CloudFront, e ai CertificateArn passa a ser obrigatorio e precisa cobri-lo.
      A zona vive no DNS on premise da Porto: a stack nao cria registro nenhum.
      VAZIO: o ambiente serve no dominio do proprio CloudFront. HTTPS existe de
      um jeito ou de outro - sem ele o cookie de sessao nao e gravado pelo
      navegador e o login falha em silencio.
    AllowedPattern: '^$|^(?!-)[a-zA-Z0-9-]{1,63}(\.[a-zA-Z0-9-]{1,63})+$'

  ApiDomainName:
    Type: String
    Default: ''
    Description: >
      Host da API, ex. api-dev.hubafiliados.com.br. Existe para chamada
      SERVIDOR-A-SERVIDOR - o servico de cupom da Porto batendo em
      /v1/webhooks. O navegador continua sem falar com a API: quem chama e o
      servidor do Next, pela rede interna do compose. Por isso o Caddy so
      publica /v1/webhooks e /v1/health neste host, e devolve 404 no resto.
      VAZIO enquanto /v1/webhooks nao existir - hoje o modulo e uma casca sem
      controller, entao este host serviria apenas o health check. Sem ele o
      Caddy nao escreve o bloco, e nada se perde. Preencher exige DomainName
      preenchido: alias de API sem a web nao e configuracao, e engano.
    AllowedPattern: '^$|^(?!-)[a-zA-Z0-9-]{1,63}(\.[a-zA-Z0-9-]{1,63})+$'

  CertificateArn:
    Type: String
    Default: ''
    Description: >
      Certificado no ACM, obrigatoriamente em us-east-1 - CloudFront so aceita
      dessa regiao, e na MESMA conta desta stack. E o certificado emitido pela
      seguranca da informacao da Porto, importado no ACM; tem que cobrir os
      nomes declarados acima. Peca o curinga desde o comeco: o pedido e o item
      lento, e um `*.dominio` cobre o host da API no dia em que ele nascer sem
      abrir um segundo chamado. Importado nao renova sozinho: quando a Porto
      reemitir, e reimportar e atualizar a stack.
      VAZIO so faz sentido com DomainName vazio - a distribuicao usa o
      certificado padrao da AWS, que serve apenas o dominio cloudfront.net.
    AllowedPattern: '^$|^arn:aws:acm:us-east-1:\d{12}:certificate/[a-f0-9-]+$'

  InstanceType:
    Type: String
    Default: t3.small
    Description: >
      x86_64 por padrao, casado com a AMI abaixo e com o build linux/amd64 do
      job `images` no ci.yml. t3.micro (1 GB) cabe - a instancia nao builda nada, so roda
      Caddy e dois processos Node - e economiza ~US$ 9/mes, ao custo de o swap
      trabalhar durante a migration do deploy. Para Graviton (t4g.small,
      ~US$ 4/mes a menos), troque TRES coisas juntas: este default, o
      LatestAmiId para o caminho arm64, e a plataforma no job `images` do
      ci.yml.

  DBInstanceClass:
    Type: String
    Default: db.t4g.micro

  DBEngineVersion:
    Type: String
    Default: '16'
    Description: >
      Versao maior basta - o RDS resolve para a menor mais recente. Fixe a menor
      (ex. 16.10) quando quiser reprodutibilidade exata entre recriacoes.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
    Description: >
      Resolvida por SSM, nunca um ami-xxxx escrito a mao (que e regional e
      envelhece). Graviton usa o caminho terminado em -arm64.

      Consequencia que nao e obvia: este tipo de parametro e reresolvido a CADA
      operacao de stack, e a AWS publica AL2023 nova mais ou menos todo mes.
      Update de stack depois de uma publicacao troca o ImageId, e ImageId novo
      exige replacement - instancia nova, volume raiz novo. Nada de estado mora
      na instancia (o banco e o RDS, os segredos sao do Secrets Manager e o TLS
      e do CloudFront), entao replacement custa um deploy, nao um incidente.

  CloudFrontPrefixListId:
    Type: String
    Default: pl-3b927c52
    AllowedPattern: '^pl-[a-f0-9]+$'
    Description: >
      Prefix list gerenciada pela AWS com as faixas de saida do CloudFront
      (com.amazonaws.global.cloudfront.origin-facing). E a unica origem que
      alcanca a instancia: sem CloudFront na frente, a maquina nao responde a
      ninguem. O default e o id em us-east-1; conferir com
      `aws ec2 describe-managed-prefix-lists --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing`.

  MailProvider:
    Type: String
    Default: logger
    AllowedValues: [resend, logger]
    Description: >
      `logger` so registra o e-mail no log em vez de enviar, e e o default
      porque a verificacao do dominio no Resend depende de registros SPF e DKIM
      na zona - que nao esta nesta conta. Com ele, o link de definir senha sai
      no CloudWatch, nao na caixa de entrada. Passe a `resend` no dia em que o
      dominio aparecer verificado la, ou o cadastro do afiliado para no meio.

  MailFromEmail:
    Type: String
    Default: nao-responda@influencersportoservico.com.br
    Description: Remetente. Com MailProvider=resend, o dominio precisa estar verificado la.

  ApiMocking:
    Type: String
    Default: enabled
    AllowedValues: [enabled, disabled]
    Description: >
      `enabled` dubla em memoria apenas /affiliate/me/wallet, que ainda nao
      existe na API; todo o resto vai para a API de verdade. Passe a `disabled`
      quando a rota da carteira nascer, ou a tela de saldo quebra.

  GitHubRepo:
    Type: String
    Default: mesainc/affiliate-hub-web
    Description: >
      Restringe o `sub` da role OIDC. Formato owner/repo, e e o slug do
      repositorio no GitHub - nao o nome do produto. Errar aqui nao quebra a
      criacao da stack: quebra o deploy, com o assume-role recusado sem dizer
      por que.
    AllowedPattern: '^[^/\s]+/[^/\s]+$'

  DeployBranch:
    Type: String
    Default: development
    AllowedPattern: '^[A-Za-z0-9._/-]{1,255}$'
    Description: >
      Unica branch que pode assumir a role de deploy desta stack. O modelo do
      repositorio e `development` para desenvolvimento e `main` para producao;
      o mesmo template serve as duas, em stacks separadas e com este parametro
      diferente. Deixar `main` aqui numa stack de dev daria a producao a chave
      do ambiente errado.

  GitHubEnvironment:
    Type: String
    Default: development
    AllowedPattern: '^[A-Za-z0-9._-]{1,255}$'
    Description: >
      Environment do GitHub que o job de deploy declara. Com `environment:` no
      job, o GitHub troca o `sub` do token por
      `repo:OWNER/REPO:environment:NOME` e a referencia da branch some da claim
      - por isso o nome precisa entrar aqui, e por isso a regra de protecao do
      ambiente no GitHub e que limita quais branches o alcancam.

  CreateGitHubOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      O provider OIDC do GitHub e um recurso de CONTA, nao de stack. Se a conta
      ja tiver um, deixe 'false' - criar o segundo faz a stack falhar com
      EntityAlreadyExists e o rollback leva tudo junto.

  # Nasce VAZIO, e o vazio e o modo seguro: o banco fica sem rota de entrada,
  # alcancavel so pela instancia da aplicacao e pelo port-forward do SSM.
  #
  # Preencher inverte isso em tres lugares de uma vez - as subnets do banco
  # ganham rota para o internet gateway, a instancia recebe IP publico e o
  # security group abre a 5432 para o CIDR. Sao os tres juntos que funcionam:
  # qualquer um sozinho nao abre nada, e por isso os tres pendem desta mesma
  # condicao.
  DbAccessCidr:
    Type: String
    Default: ''
    # Octeto por octeto, e nao \d{1,3}: 999.999.999.999/32 casava com o padrao
    # frouxo e so falhava no AuthorizeSecurityGroupIngress, com o update ja em
    # curso. Bits de host ligados (203.0.113.45/24) continuam passando daqui -
    # isso um regex nao pega, e quem recusa e a API da EC2.
    AllowedPattern: '^$|^((25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(25[0-5]|2[0-4]\d|1?\d?\d)/(3[0-2]|[12]?\d)$'
    Description: >
      CIDR que alcanca o Postgres na 5432 pela internet, ex. 200.201.202.0/24.
      VAZIO mantem o banco fechado - acesso so por `npm run db:tunnel`.
      Preenchido, o banco passa a atender de fora e a senha do master vira o
      unico controle de quem entra: a tabela guarda CPF e chave PIX de
      afiliado, e o registro por pessoa que o ssm:StartSession deixa no
      CloudTrail deixa de existir. Prefira a faixa de saida da VPN a
      0.0.0.0/0.

  # So existe por causa de 0.0.0.0/0, e so faz sentido porque nao ha VPN: sem
  # ponto de saida fixo para listar, a internet inteira e o valor que funciona,
  # e a camada de rede deixa de ser um controle disponivel. O que sobra e
  # tornar a abertura deliberada - um parametro a mais que o deploy distraido
  # nao digita.
  AcknowledgeDbOpenToInternet:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Confirmacao de que DbAccessCidr=0.0.0.0/0 e intencional. Irrelevante com
      qualquer outro CIDR, e ignorado com o banco fechado.

# Os tres parametros de dominio se acoplam, e o tipo deles nao expressa isso.
# Sem estas regras a combinacao errada falha dois minutos depois, no CloudFront,
# com mensagem que nao aponta para o parametro. Com elas, falha na hora do
# create, dizendo qual campo esta faltando.
Rules:
  DomainRequiresCertificate:
    RuleCondition: !Not [!Equals [!Ref DomainName, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CertificateArn, '']]
        AssertDescription: >
          DomainName preenchido exige CertificateArn. Alias no CloudFront nao
          existe sem um certificado do ACM, em us-east-1, que cubra o nome.

  ApiDomainRequiresDomain:
    RuleCondition: !Not [!Equals [!Ref ApiDomainName, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref DomainName, '']]
        AssertDescription: >
          ApiDomainName exige DomainName. O host da API existe para o webhook
          servidor-a-servidor; publica-lo sem a aplicacao web nao e uma
          configuracao deste ambiente.

  # Mesma classe do DomainRequiresCertificate acima: falha no gate do
  # parametro, antes de existir change set e antes de qualquer modify no RDS.
  DbAccessCidrOpenToInternetIsDeliberate:
    RuleCondition: !Equals [!Ref DbAccessCidr, '0.0.0.0/0']
    Assertions:
      - Assert: !Equals [!Ref AcknowledgeDbOpenToInternet, 'true']
        AssertDescription: >
          DbAccessCidr=0.0.0.0/0 expoe CPF e chave PIX de afiliado com a senha
          do master como unico controle. Passe AcknowledgeDbOpenToInternet=true
          para confirmar que a exposicao e intencional.

Conditions:
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, 'true']
  # Duas, e nao uma: o modo mais provavel de rodar e dominio na web e nada na
  # API - o host da API so existe para o webhook, que ainda nao foi escrito.
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  HasApiDomain: !Not [!Equals [!Ref ApiDomainName, '']]
  DbIsPublic: !Not [!Equals [!Ref DbAccessCidr, '']]

Resources:
  # =========================================================== Rede
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub 'porto-hub-${EnvironmentName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub 'porto-hub-${EnvironmentName}-igw'

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # A instancia fica aqui, com Elastic IP. E o que apaga o NAT Gateway
  # (~US$ 33/mes): ela alcanca ECR, SSM, Secrets Manager e Resend pelo proprio
  # internet gateway. A exposicao e controlada pelo security group, que abre 80
  # e 443 e mais nada - nao ha porta 22 nem key pair.
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub 'porto-hub-${EnvironmentName}-public-a'

  # Duas subnets porque o DBSubnetGroup exige duas AZs, mesmo com a instancia
  # single-AZ. Sem route table por padrao: o RDS nao precisa de saida para a
  # internet, e por isso nao ha NAT nenhum para pagar. Com DbAccessCidr
  # preenchido elas passam a apontar para a PublicRouteTable - ver
  # DbSubnetARouteTableAssociation. O nome 'private' fica: mudar a tag e
  # cosmetico, e o logical id nao muda sem substituir a subnet, o que levaria
  # o banco junto.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub 'porto-hub-${EnvironmentName}-private-a'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub 'porto-hub-${EnvironmentName}-private-b'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'porto-hub-${EnvironmentName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  # PubliclyAccessible sozinho nao abre o banco: o RDS ganha IP publico, o
  # pacote chega pelo internet gateway e a resposta nao acha caminho de volta,
  # porque a subnet do banco nao tem rota default. O sintoma e timeout, o mesmo
  # de quando nao ha rota nenhuma - por isso as duas coisas andam juntas.
  DbSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: DbIsPublic
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PublicRouteTable

  DbSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: DbIsPublic
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PublicRouteTable

  # =========================================================== Security groups
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: porto-hub app - somente 80, e so a partir do CloudFront
      VpcId: !Ref Vpc
      # Uma porta, uma origem. O TLS termina no CloudFront, entao a 443 nao
      # existe aqui, e nao ha ACME porque nao ha certificado nesta maquina.
      # Sem CloudFront na frente, a instancia nao responde a ninguem - nem a
      # quem souber o Elastic IP.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          # Sem apostrofo: a EC2 recusa a regra inteira com InvalidRequest se a
          # descricao sair de [a-zA-Z0-9 _-:/()#,@[]+=&;{}!$*].
          Description: HTTP a partir do CloudFront - unica entrada da instancia
      # Saida sem restricao, e de propriedade deliberada: a instancia precisa
      # alcancar ECR, SSM, Secrets Manager, Resend e o resolvedor
      # da VPC. Fechar isso em regra de porta e um exercicio que quebra de
      # formas silenciosas (NTP link-local, DNS, endpoint regional novo) e nao
      # muda o risco real, que e alguem com shell na maquina - e esse e barrado
      # por IAM, no ssm:StartSession, nao aqui.
      Tags:
        - Key: Name
          Value: !Sub 'porto-hub-${EnvironmentName}-app-sg'

  # 3000 e 3005 nao aparecem aqui de proposito: a API e publicada apenas em
  # loopback e a web so existe na rede interna do compose. Quem fala com as duas
  # e o Caddy, dentro da maquina.
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: porto-hub RDS - 5432 apenas a partir da instancia
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Postgres a partir da instancia da aplicacao
        # A regra da aplicacao continua valendo em qualquer modo: de dentro da
        # VPC o endpoint resolve para o IP privado, e o trafego da API nunca
        # sai pelo internet gateway nem quando o banco esta publico.
        - !If
          - DbIsPublic
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            CidrIp: !Ref DbAccessCidr
            Description: Postgres a partir do CIDR de DbAccessCidr
          - !Ref 'AWS::NoValue'
      # O RDS so responde, nunca inicia conexao. Declarar a saida substitui o
      # "permite tudo" que a EC2 adiciona sozinha quando o campo fica de fora; o
      # destino e o loopback justamente por nao existir destino legitimo.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 127.0.0.1/32
          Description: Sem saida - o banco nunca inicia conexao
      Tags:
        - Key: Name
          Value: !Sub 'porto-hub-${EnvironmentName}-db-sg'

  # =========================================================== Segredos
  # Nenhum valor sensivel no template, na CLI ou nos eventos da stack: o RDS
  # consome a senha por {{resolve:secretsmanager:}}.
  #
  # Nenhum dos tres tem `Name` fixo, e isso e deliberado. O DeleteSecret do
  # CloudFormation agenda a exclusao com janela de recuperacao, nao apaga na
  # hora: com nome fixo, recriar a stack falharia por 30 dias com "already
  # scheduled for deletion" - justamente o contrario do que um ambiente de
  # desenvolvimento precisa. Quem precisa do ARN le dos outputs.
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Credenciais do RDS Postgres do Hub de Afiliados
      GenerateSecretString:
        SecretStringTemplate: '{"username":"porto"}'
        GenerateStringKey: password
        PasswordLength: 32
        # Sem pontuacao para nao quebrar a connection string montada no deploy.
        ExcludePunctuation: true

  # O JWT_SECRET nasce gerado com 48 caracteres - satisfaz o min(32) do Joi sem
  # passar por mao humana. A chave do Resend nasce REPLACE_ME e e injetada
  # depois do create pelo comando do output SetResendKeyCommand.
  #
  # Nao mexa no GenerateSecretString depois do primeiro create: qualquer
  # alteracao nele regenera o segredo inteiro e leva junto a chave do Resend
  # injetada a mao. O sintoma - e-mail parando de sair depois de um update de
  # stack sem relacao nenhuma - nao aponta para ca sozinho.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Segredos de aplicacao do Hub de Afiliados
      GenerateSecretString:
        SecretStringTemplate: '{"resend_api_key":"REPLACE_ME"}'
        GenerateStringKey: jwt_secret
        PasswordLength: 48
        ExcludePunctuation: true

  # Secret proprio - e nao um campo do anterior - porque GenerateSecretString
  # gera UMA chave por segredo. Vale os US$ 0,40/mes: a alternativa era a senha
  # publicada no README (MudarAgora!2026) valendo num painel exposto a internet.
  SeedSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      # "Hub de Afiliados" nos tres: e por essa descricao que o comando de
      # limpeza do README acha os segredos, agora que nao ha mais nome fixo.
      Description: Senha inicial dos operadores do painel do Hub de Afiliados, trocada no primeiro login
      GenerateSecretString:
        SecretStringTemplate: '{"note":"senha inicial; should_change_password fica true"}'
        GenerateStringKey: admin_password
        PasswordLength: 24
        ExcludePunctuation: true

  # =========================================================== Banco
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets privadas do Hub de Afiliados
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      Tags:
        - Key: Name
          Value: !Sub 'porto-hub-${EnvironmentName}-db-subnets'

  Database:
    Type: AWS::RDS::DBInstance
    # As associacoes de rota primeiro. Sem isto o CloudFormation nao ve
    # dependencia entre elas e o modify do RDS, e pode dar o deploy por
    # concluido com a instancia ja publica e a subnet ainda sem rota default:
    # o passo de verificacao do README daria timeout num deploy correto.
    # Ignorado sozinho quando DbIsPublic e falsa.
    DependsOn: [DbSubnetARouteTableAssociation, DbSubnetBRouteTableAssociation]
    # E3005 reclama de DependsOn para recurso condicional. A AWS documenta que
    # ignora a dependencia quando a condition e falsa, que e exatamente o que
    # se quer aqui; a regra e conservadora porque o padrao costuma ser engano.
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [E3005]
    # Ambiente de desenvolvimento: o banco e recriavel pelo seed e a stack
    # precisa poder ser deletada inteira sem briga.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub 'porto-hub-${EnvironmentName}-db'
      Engine: postgres
      EngineVersion: !Ref DBEngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: '20'
      StorageType: gp3
      # Ligado tambem em dev: a tabela guarda CPF e chave PIX de afiliado.
      StorageEncrypted: true
      DBName: hub_afiliados
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      # Mesma AZ da instancia. Sem isto o single-AZ cai onde o RDS quiser, e
      # metade das vezes e a outra AZ: todo o trafego do banco vira cross-AZ,
      # cobrado nos dois sentidos e com mais latencia, sem nada em troca.
      AvailabilityZone: !Select [0, !GetAZs '']
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      # Fechado por padrao - o acesso de fora e por port-forward do SSM,
      # comando no output. DbAccessCidr preenchido abre, e a decisao fica no
      # parametro em vez de escondida aqui. Trocar este valor e um modify do
      # RDS: sem substituicao e sem perder dado.
      PubliclyAccessible: !If [DbIsPublic, true, false]
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      # Janelas em UTC, escolhidas para cair de madrugada no horario de Brasilia
      # (UTC-3). Sem elas a AWS sorteia um horario que pode ser o meio da tarde
      # de quem esta usando o ambiente - e `AutoMinorVersionUpgrade` reinicia o
      # banco dentro da janela de manutencao.
      PreferredBackupWindow: '06:00-06:30'
      PreferredMaintenanceWindow: 'Sun:07:00-Sun:07:30'
      Tags:
        - Key: Name
          Value: !Sub 'porto-hub-${EnvironmentName}-db'

  # =========================================================== Registro e deploy
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub 'porto-hub-${EnvironmentName}/api'
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Guarda as 10 ultimas",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}

  WebRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub 'porto-hub-${EnvironmentName}/web'
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Guarda as 10 ultimas",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}

  # O compose e o install-release.sh viajam por aqui, e nao embutidos no
  # template: assim existe UMA copia de cada, versionada no repositorio e
  # lintada pela CI. A referencia do bolao duplicou o script dentro do YAML e as
  # duas copias divergiram.
  DeployBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub 'porto-hub-${EnvironmentName}-deploy-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub 'porto-hub-${EnvironmentName}-deploy'

  # O bucket carrega o compose, o script de release e o backup dos certificados
  # do Caddy. Nada disso tem motivo para trafegar em claro.
  DeployBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeployBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DeployBucket.Arn
              - !Sub '${DeployBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/porto-hub/${EnvironmentName}'
      RetentionInDays: 14

  # Toda a configuracao da maquina vive aqui, e nao no UserData. UserData e
  # imutavel na pratica: mudar um valor nele ou substitui a instancia - levando
  # o volume com os certificados do Caddy, e com ele a cota semanal do Let's
  # Encrypt - ou nao roda de novo, porque o cloud-init e `once`, e a mudanca
  # passa despercebida. No Parameter Store, trocar MailProvider ou absorver um
  # endpoint novo do RDS e um update de stack seguido do proximo deploy.
  #
  # Nada de secreto entra aqui: sao ARNs de segredo, nunca o conteudo deles.
  ConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      # Este nome e repetido literalmente no UserData e na politica da
      # InstanceRole. E deliberado: `!Ref` nos dois lugares fecharia um ciclo
      # de dependencia, porque o Value abaixo le a distribuicao. Mudou aqui,
      # mude nos dois - o `grep` do caminho acha os tres.
      Name: !Sub '/porto-hub/${EnvironmentName}/config'
      Type: String
      Description: Configuracao nao-secreta lida pelo install-release.sh a cada deploy
      # `DOMAIN_NAME` sem dominio proprio cai para o nome do CloudFront, e nao
      # para vazio. Ele nao e enfeite: alimenta o roteamento por Host do Caddy,
      # o APP_BASE_URL dos links de e-mail e o PUBLIC_DOMAIN_NAME que vira
      # `allowedOrigins` das Server Actions - vazio ali, todo POST volta 500.
      # Com o fallback aqui, o install-release.sh nao precisa saber de nada.
      Value: !Sub
        - |
          AWS_REGION=${AWS::Region}
          ECR_REGISTRY=${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
          API_IMAGE=${ApiRepository.RepositoryUri}
          WEB_IMAGE=${WebRepository.RepositoryUri}
          LOG_GROUP=${LogGroup}
          DEPLOY_BUCKET=${DeployBucket}
          DB_HOST=${Database.Endpoint.Address}
          DB_NAME=hub_afiliados
          DB_SECRET_ARN=${DbSecret}
          APP_SECRET_ARN=${AppSecret}
          SEED_SECRET_ARN=${SeedSecret}
          DOMAIN_NAME=${EffectiveDomainName}
          API_DOMAIN_NAME=${ApiDomainName}
          MAIL_PROVIDER=${MailProvider}
          MAIL_FROM_EMAIL=${MailFromEmail}
          API_MOCKING=${ApiMocking}
        - EffectiveDomainName: !If
            - HasDomain
            - !Ref DomainName
            - !GetAtt Distribution.DomainName

  # =========================================================== IAM
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Da o Session Manager: shell na maquina e port-forward para o RDS
        # privado sem abrir a 22 e sem chave privada para vazar.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: porto-hub-instance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DbSecret
                  - !Ref AppSecret
                  - !Ref SeedSecret
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource:
                  - !GetAtt ApiRepository.Arn
                  - !GetAtt WebRepository.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  # O backup dos certificados do Caddy sobe por aqui a cada
                  # release. E o que faz a instancia ser descartavel de verdade.
                  - s3:PutObject
                Resource: !Sub '${DeployBucket.Arn}/*'
              # Sem isto o sinal do CreationPolicy e recusado e a stack espera
              # os 15 minutos inteiros antes de fazer rollback por timeout - uma
              # falha que nao diz o que aconteceu.
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
              - Effect: Allow
                Action: ssm:GetParameter
                # Nome literal, e nao `!Ref ConfigParameter`: o parametro passou a
                # ler `Distribution.DomainName`, e a referencia aqui fecharia o
                # ciclo ConfigParameter -> Distribution -> ElasticIpAssociation
                # -> Instance -> InstanceProfile -> InstanceRole.
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/porto-hub/${EnvironmentName}/config'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                # ARN montado a mao: `LogGroup.Arn` ja termina em `:*`, e
                # concatenar outro produz `:*:*`, que nao casa com a forma
                # `log-group:NOME:*` que o DescribeLogStreams autoriza.
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroup}:*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # Sem ThumbprintList: o IAM valida o endpoint do GitHub contra a propria
  # biblioteca de CAs raiz e ignora o thumbprint desde 2023. Fixar um aqui so
  # criaria mais um valor para envelhecer.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Sem chave de AWS no GitHub: o workflow troca o token do proprio Actions por
  # credencial temporaria, e so a partir da `main` deste repositorio.
  GitHubOidcRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'porto-hub-${EnvironmentName}-github-deploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # `!Ref` no provider - e nao o ARN montado como string - quando a
              # stack e quem o cria: assim o CloudFormation enxerga a
              # dependencia e nunca tenta criar a role antes dele. Com string, a
              # ordem fica ao acaso e o IAM recusa com "Invalid principal in
              # policy" de forma intermitente. Quando o provider ja existe na
              # conta nao ha o que ordenar, e o ARN construido resolve.
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Dois `sub`, e nao um, porque o GitHub monta a claim de dois
                # jeitos: job comum vira `ref:refs/heads/<branch>`; job com
                # `environment:` declarado vira `environment:<nome>` e perde a
                # referencia da branch. O primeiro e o job que publica as
                # imagens, o segundo e o deploy. Lista em StringEquals e OU.
                #
                # A branch some do segundo valor, entao quem garante que so a
                # DeployBranch chega la e a regra de protecao do ambiente no
                # GitHub - configure-a com "Selected branches" apontando para
                # ela, ou qualquer branch podera pedir o deploy.
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepo}:ref:refs/heads/${DeployBranch}'
                  - !Sub 'repo:${GitHubRepo}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: porto-hub-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !GetAtt ApiRepository.Arn
                  - !GetAtt WebRepository.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub '${DeployBucket.Arn}/*'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/${DeployDocument}'
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}'
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: '*'
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'

  # =========================================================== Deploy por SSM
  DeployDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub 'porto-hub-${EnvironmentName}-deploy'
      DocumentType: Command
      # O padrao e `Replace`: editar o Content apagaria e recriaria o documento
      # de mesmo nome, com uma janela em que o deploy nao acha nada.
      UpdateMethod: NewVersion
      TargetType: /AWS::EC2::Instance
      Content:
        schemaVersion: '2.2'
        description: Baixa a release do bucket de deploy e instala na instancia.
        parameters:
          imageTag:
            type: String
            description: Tag das imagens no ECR, normalmente o SHA do commit.
            # O valor e interpolado num shell. O padrao e o que impede que uma
            # tag como `x; rm -rf /` vire comando.
            allowedPattern: '^[A-Za-z0-9._-]{1,128}$'
        mainSteps:
          - action: aws:runShellScript
            name: installRelease
            inputs:
              runCommand:
                - 'set -euo pipefail'
                - !Sub 'aws s3 cp --region ${AWS::Region} s3://${DeployBucket}/docker-compose.prod.yml /opt/porto-hub/docker-compose.prod.yml'
                - !Sub 'aws s3 cp --region ${AWS::Region} s3://${DeployBucket}/install-release.sh /opt/porto-hub/install-release.sh'
                - 'chmod +x /opt/porto-hub/install-release.sh'
                - '/opt/porto-hub/install-release.sh "{{ imageTag }}"'

  # =========================================================== Instancia
  ElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub 'porto-hub-${EnvironmentName}-eip'

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  # =========================================================== CloudFront
  # Duas razoes, e nenhuma delas e cache:
  #  1. Termina o TLS com o certificado da Porto, que e importado no ACM.
  #  2. Da um nome ESTAVEL para a Imperva apontar. Sem ele, o origin registrado
  #     la seria o Elastic IP, e recriar a stack viraria uma RDM no time deles.
  # O cache de /_next/static/* e bonus: sao arquivos com hash no nome.
  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: ElasticIpAssociation
    # W1030 avisa que `CertificateArn` pode nao ser um ARN de certificado -
    # verdade, ele aceita vazio. Quem garante que nao esta vazio no ramo que o
    # usa e a regra DomainRequiresCertificate, que o cfn-lint nao le.
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W1030
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'porto-hub-${EnvironmentName}'
        # Os dois hosts entram na MESMA distribuicao. O roteamento e do Caddy,
        # que le o Host encaminhado pela politica AllViewer.
        Aliases: !If
          - HasDomain
          - !If
            - HasApiDomain
            - [!Ref DomainName, !Ref ApiDomainName]
            - [!Ref DomainName]
          - !Ref 'AWS::NoValue'
        # O objeto inteiro sob o !If, e nao campo a campo: com
        # CloudFrontDefaultCertificate o CloudFront recusa MinimumProtocolVersion
        # declarado, e o certificado padrao serve so o dominio cloudfront.net -
        # e por isso que ele anda junto com a ausencia de alias.
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: instance
            # CloudFront exige NOME para origin customizado - nao aceita IP. Este
            # e o DNS publico que a AWS da ao Elastic IP; o formato `compute-1`
            # e o de us-east-1, que ja e obrigatoria por causa do ACM.
            DomainName: !Sub
              - 'ec2-${DashedIp}.compute-1.amazonaws.com'
              - DashedIp: !Join ['-', !Split ['.', !Ref ElasticIp]]
            CustomOriginConfig:
              HTTPPort: 80
              # A perna CloudFront -> origin vai em claro. E o preco de nao ter
              # certificado na instancia, e o que a limita e o security group,
              # que so aceita as faixas do CloudFront. ACEITAVEL EM DEV, NAO EM
              # PRODUCAO: la, um nome de origin proprio com certificado valido e
              # `https-only` fecham isso.
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: instance
          # Todos os metodos: as sete Server Actions do Next sao POST, e o
          # default do CloudFront (so GET e HEAD) as recusaria antes de a
          # requisicao chegar na aplicacao.
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # CachingDisabled: pagina de afiliado servida para outro afiliado seria
          # incidente, nao bug - ha CPF e chave PIX nessa arvore.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AllViewer encaminha Host, cookies e query string. Os tres importam:
          # o Host, para o Caddy rotear e para a Server Action nao abortar com
          # `Invalid Server Actions request`; os cookies, porque a sessao inteira
          # e cookie httpOnly e o default do CloudFront os removeria.
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: instance
            AllowedMethods: [GET, HEAD]
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            # CachingOptimized. Seguro aqui e so aqui: o nome do arquivo carrega
            # o hash do conteudo, entao build novo gera caminho novo.
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
      Tags:
        - Key: Name
          Value: !Sub 'porto-hub-${EnvironmentName}-cdn'

  Instance:
    Type: AWS::EC2::Instance
    # A associacao entra junto: ate ela existir a subnet cai na route table
    # principal da VPC, que so tem a rota local. Instancia que boota nessa
    # janela nao alcanca o dnf, nem o GitHub, nem o proprio signal-resource - e
    # sem o sinal a stack espera os PT15M inteiros antes de dizer que falhou.
    DependsOn: [VpcGatewayAttachment, PublicSubnetARouteTableAssociation]
    # Sem isto o CREATE_COMPLETE chega assim que a instancia fica `running`, e
    # um UserData que falhou vira falso positivo silencioso - o erro so
    # apareceria no primeiro deploy, com "docker: command not found".
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M
        Count: 1
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds: [!Ref AppSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      # Sem key pair de proposito: o acesso e por SSM Session Manager.
      MetadataOptions:
        HttpTokens: required
        # 1 faz o IMDS recusar pacote vindo da bridge do Docker, que e um hop a
        # mais: nenhum container assume a role da instancia. Quem le o Secrets
        # Manager e o ECR passa a ser o host, no deploy - e a aplicacao nao faz
        # chamada nenhuma a AWS em runtime, entao nao perde nada.
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub 'porto-hub-${EnvironmentName}-app'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          # O sinal vai pela CLI da AWS, que ja vem na AMI, e nao pelo
          # cfn-signal, que exigiria um `dnf install aws-cfn-bootstrap` antes.
          # A diferenca importa: com o cfn-bootstrap, uma falha nesse primeiro
          # install nao teria como avisar ninguem, e a stack esperaria os 15
          # minutos do CreationPolicy por um sinal que nunca viria. Assim a
          # armadilha esta armada desde a primeira linha.
          IMDS_TOKEN="$(curl -sS -X PUT http://169.254.169.254/latest/api/token \
            -H 'X-aws-ec2-metadata-token-ttl-seconds: 300')"
          INSTANCE_ID="$(curl -sS -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
            http://169.254.169.254/latest/meta-data/instance-id)"

          signal() {
            aws cloudformation signal-resource \
              --stack-name ${AWS::StackName} --logical-resource-id Instance \
              --unique-id "$INSTANCE_ID" --status "$1" --region ${AWS::Region}
          }
          trap 'signal FAILURE' ERR

          # Swap antes de tudo. Sao 2 GB de RAM segurando dockerd, Caddy e dois
          # processos Node, mais um terceiro durante a migration do deploy.
          # swappiness 10 mantem o swap como seguro contra OOM, nao como memoria
          # de trabalho - swap em EBS e lento e queima IOPS.
          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
          fi
          sysctl -w vm.swappiness=10
          echo 'vm.swappiness=10' > /etc/sysctl.d/99-swap.conf

          # Sem `dnf update -y`: a AMI vem resolvida pelo SSM e ja atualizada, e
          # atualizar tudo no boot faz duas instancias da mesma stack nascerem
          # diferentes - fora o kernel novo pedindo reboot no meio do create.
          dnf install -y docker python3
          systemctl enable --now docker

          # O plugin do compose nao vem nos repositorios do AL2023. Versao
          # fixada: `latest` transformaria um reboot em upgrade silencioso.
          COMPOSE_VERSION=v2.32.4
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-$(uname -m)"
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version

          mkdir -p /opt/porto-hub

          # As duas unicas coisas que o UserData sabe: em que regiao esta e onde
          # achar o resto. Tudo o mais vem do Parameter Store a cada deploy -
          # nada que possa mudar durante a vida da instancia entra aqui, porque
          # o cloud-init nao roda de novo para corrigir.
          cat > /opt/porto-hub/bootstrap.env <<'BOOTSTRAP'
          AWS_REGION=${AWS::Region}
          CONFIG_PARAM=/porto-hub/${EnvironmentName}/config
          BOOTSTRAP

          signal SUCCESS

Outputs:
  # Sem dominio proprio os dois saem no nome do CloudFront - e continuam sendo
  # a URL de verdade do ambiente, com HTTPS pelo certificado padrao da AWS.
  WebUrl:
    Description: URL publica do ambiente - landing, area do afiliado e painel
    Value: !If
      - HasDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${Distribution.DomainName}'

  PanelUrl:
    Description: Login do painel de analise
    Value: !If
      - HasDomain
      - !Sub 'https://${DomainName}/admin/login'
      - !Sub 'https://${Distribution.DomainName}/admin/login'

  # ---------------------------------------------------------------------------
  # ESTE e o valor que sai da nossa mao e entra na da Porto. E o origin que o
  # time da Imperva registra, e para ele que os dois nomes apontam no BIND on
  # premise. Nao muda quando a instancia e recriada - foi por isso que o
  # CloudFront entrou.
  CloudFrontDomainName:
    Description: Origin para a Imperva, e alvo dos CNAMEs de DomainName e ApiDomainName
    Value: !GetAtt Distribution.DomainName

  # Condicional porque sem ApiDomainName o Caddy nao escreve o bloco, e uma URL
  # que devolve 404 no output e pior que output nenhum. A API segue alcancavel
  # pelo servidor do Next e pelo tunel do SwaggerTunnelCommand.
  ApiUrl:
    Condition: HasApiDomain
    Description: Host da API, so para chamada servidor-a-servidor (/v1/webhooks)
    Value: !Sub 'https://${ApiDomainName}'

  ElasticIpAddress:
    Description: >
      Origin do CloudFront, e detalhe interno: a Porto NAO aponta DNS para ca.
      A instancia so aceita conexao das faixas do CloudFront, entao este
      endereco nao responde a mais ninguem.
    Value: !Ref ElasticIp

  InstanceId:
    Value: !Ref Instance

  RdsEndpoint:
    Value: !GetAtt Database.Endpoint.Address

  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri

  WebRepositoryUri:
    Value: !GetAtt WebRepository.RepositoryUri

  DeployBucketName:
    Value: !Ref DeployBucket

  DeployDocumentName:
    Value: !Ref DeployDocument

  GitHubOidcRoleArn:
    Description: Vai no secret AWS_DEPLOY_ROLE_ARN, usado pelo ci.yml e pelo cd.yml
    Value: !GetAtt GitHubOidcRole.Arn

  SsmSessionCommand:
    Description: Shell na maquina, sem SSH e sem porta 22
    Value: !Sub 'aws ssm start-session --target ${Instance} --region ${AWS::Region}'

  SwaggerTunnelCommand:
    Description: >
      Swagger em http://localhost:3000/v1/docs. A API nao e publicada na
      internet - so o servidor do Next fala com ela - entao este e o caminho.
    Value: !Sub 'aws ssm start-session --target ${Instance} --region ${AWS::Region} --document-name AWS-StartPortForwardingSession --parameters ''{"portNumber":["3000"],"localPortNumber":["3000"]}'''

  RdsTunnelCommand:
    Description: psql em localhost:5433 contra o RDS privado
    Value: !Sub
      - 'aws ssm start-session --target ${Instance} --region ${AWS::Region} --document-name AWS-StartPortForwardingSessionToRemoteHost --parameters ''{"host":["${DbHost}"],"portNumber":["5432"],"localPortNumber":["5433"]}'''
      - DbHost: !GetAtt Database.Endpoint.Address

  ConfigParameterName:
    Description: Parametro com a configuracao nao-secreta lida a cada deploy
    Value: !Ref ConfigParameter

  # O nome do segredo e gerado pelo CloudFormation, entao nao ha string fixa que
  # um script possa adivinhar: quem precisa da senha resolve o ARN por aqui.
  DbSecretArn:
    Description: Segredo com usuario e senha do master do RDS
    Value: !Ref DbSecret

  ReadDbPasswordCommand:
    Description: Senha do master do RDS, para o psql pelo tunel
    Value: !Sub 'aws secretsmanager get-secret-value --secret-id ${DbSecret} --region ${AWS::Region} --query SecretString --output text'

  ReadSeedPasswordCommand:
    Description: Senha inicial dos operadores do painel (trocada no primeiro login)
    Value: !Sub 'aws secretsmanager get-secret-value --secret-id ${SeedSecret} --region ${AWS::Region} --query SecretString --output text'

  # O valor vem de ARQUIVO, nunca de argv: segredo em argv fica visivel em `ps`
  # e no historico do shell - exatamente o que tira-lo do template evitou.
  SetResendKeyCommand:
    Description: Injeta o RESEND_API_KEY lendo de ./resend_key.txt, preservando os demais campos
    Value: !Sub 'aws secretsmanager get-secret-value --secret-id ${AppSecret} --region ${AWS::Region} --query SecretString --output text | python3 -c ''import json,sys;s=json.load(sys.stdin);s["resend_api_key"]=open("resend_key.txt").read().strip();sys.stdout.write(json.dumps(s))'' > secret.json && aws secretsmanager put-secret-value --secret-id ${AppSecret} --region ${AWS::Region} --secret-string file://secret.json && rm -f secret.json resend_key.txt'
