name: CD

# Uma implementacao de deploy so, chamada de dois jeitos:
#   - pela CI, com `uses:`, depois de todos os jobs de verificacao passarem;
#   - a mao, para voltar uma release — e ai o `imageTag` e a tag anterior.
# O bolao mantem dois arquivos quase iguais para dev e prod; aqui a diferenca
# entre uma chamada e outra e um parametro, nao um arquivo para divergir.
on:
  workflow_call:
    inputs:
      imageTag:
        required: true
        type: string
      stackName:
        required: false
        type: string
        default: porto-hub-dev
      environment:
        required: false
        type: string
        default: development
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'Tag das imagens no ECR (SHA do commit). Uma tag anterior volta a release.'
        required: true
        type: string
      stackName:
        description: 'Nome da stack do CloudFormation.'
        required: false
        type: string
        default: porto-hub-dev
      environment:
        description: 'Environment do GitHub — precisa casar com o parametro GitHubEnvironment da stack.'
        required: false
        type: string
        default: development

permissions:
  contents: read
  id-token: write

# Dev mora em us-east-1 e prod em ca-central-1. A regiao sai do environment,
# que ja escolhe a role, para um rollback manual nao ter um terceiro campo a
# errar.
env:
  AWS_REGION: ${{ inputs.environment == 'production' && 'ca-central-1' || 'us-east-1' }}

jobs:
  # A espera pelo revisor do environment fica num job proprio, fora da
  # concorrencia. Run esperando aprovacao conta como em andamento: no mesmo job
  # do deploy, um deploy de prod sem aprovar prendia o grupo, e um rollback
  # manual ficava na fila atras dele - ou era cancelado em silencio quando
  # outro push chegava, porque o GitHub guarda um so pendente por grupo.
  #
  # O nome tem que ser o mesmo do parametro GitHubEnvironment da stack. E a
  # regra "Selected branches" do environment que impede outra branch de pedir
  # o deploy.
  approve:
    name: Aprovacao
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    permissions: {}
    steps:
      - run: echo "Deploy de ${{ inputs.imageTag }} liberado em ${{ inputs.environment }}"

  deploy:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Por ambiente, e so depois da aprovacao: um deploy de dev nao espera o de
    # prod, dois do mesmo ambiente nunca rodam juntos, e a fila so tem o que
    # alguem ja liberou.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    # Sem `environment` aqui, o `sub` do token OIDC e
    # `repo:OWNER/REPO:ref:refs/heads/<branch>`, que a trust policy so aceita
    # para a DeployBranch da stack. Rollback manual roda a partir dela.

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          # Uma role por stack, e cada uma so alcanca os proprios recursos.
          role-to-assume: ${{ inputs.environment == 'production' && secrets.AWS_PROD_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ler os outputs da stack
        id: stack
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${{ inputs.stackName }}" \
            --query 'Stacks[0].Outputs' --output json)"
          for key in DeployBucketName DeployDocumentName InstanceId; do
            value="$(echo "$outputs" | jq -r --arg k "$key" '.[] | select(.OutputKey==$k) | .OutputValue')"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      # O compose e o script vao do repositorio para o bucket a cada deploy — e
      # o que garante que a maquina rode a versao versionada aqui.
      - name: Publicar compose e script de release
        env:
          BUCKET: ${{ steps.stack.outputs.DeployBucketName }}
        run: |
          set -euo pipefail
          aws s3 cp infra/compose/docker-compose.prod.yml "s3://$BUCKET/docker-compose.prod.yml"
          aws s3 cp infra/scripts/install-release.sh "s3://$BUCKET/install-release.sh"

      - name: Instalar a release na instancia
        env:
          DOCUMENT: ${{ steps.stack.outputs.DeployDocumentName }}
          INSTANCE: ${{ steps.stack.outputs.InstanceId }}
          IMAGE_TAG: ${{ inputs.imageTag }}
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --document-name "$DOCUMENT" \
            --instance-ids "$INSTANCE" \
            --parameters "imageTag=$IMAGE_TAG" \
            --query 'Command.CommandId' --output text)"
          echo "SSM command: $command_id"

          # `wait` sai com erro quando o comando falha, mas sem dizer por que —
          # o `|| true` deixa o log de verdade ser impresso antes do exit.
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE" || true

          status="$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE" --query 'Status' --output text)"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE" --query 'StandardOutputContent' --output text
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE" --query 'StandardErrorContent' --output text >&2

          [ "$status" = "Success" ] || { echo "Deploy falhou: $status" >&2; exit 1; }
