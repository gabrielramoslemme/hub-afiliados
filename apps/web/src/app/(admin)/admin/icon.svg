<svg xmlns="http://www.w3.org/2000/svg" viewBox="72.31 43.22 490 490" role="img" aria-label="Porto">
  <!--
    O ícone do painel. Mesmo símbolo do portal (src/app/icon.svg), mesmo traçado
    do kit, e a única diferença é o tom do azulejo — que é o ponto: quem analisa
    cadastro abre o painel e o portal lado a lado, e a 16px a cor do azulejo é o
    que separa uma aba da outra. Só a cor diferencia porque o desenho não pode:
    a marca é uma só.

    O tom é o `color-blue-900` do `globals.css`, a ponta escura do
    `gradient-brand`. Literal porque SVG servido como arquivo não enxerga o
    `@theme` — ao mexer no token, mexa aqui também.

    Não é o `positive` do kit (o preto #1d1d1b): preto sobre a barra escura do
    navegador perde a borda do azulejo e sobra a vela solta no vazio. O azulejo
    tem de se sustentar nos dois temas, e só o tom médio faz isso. O traçado
    segue o kit; o tom do painel é sinalização deste produto, não da marca.

    Sobre as duas camadas e o viewBox quadrado, ver src/app/icon.svg.
  -->
  <path fill="#ffffff" d="M501.37,43.22H133.23c-31.64,0-57.28,26.04-57.28,58.15v373.7c0,32.12,25.65,58.15,57.28,58.15h368.14c31.64,0,57.29-26.03,57.29-58.15V101.37c0-32.11-25.65-58.15-57.29-58.15"/>
